# alembic.ini — Database migration configuration.
# Run: alembic upgrade head   (to apply all migrations)
# Run: alembic revision --autogenerate -m "description"  (to create a migration)

[alembic]
script_location = alembic
prepend_sys_path = .

# database URL is read from environment; override here for alembic CLI
# For actual use, set DATABASE_SYNC_URL in .env
sqlalchemy.url = postgresql://rpg_user:rpg_pass@localhost:5432/rpg_db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
